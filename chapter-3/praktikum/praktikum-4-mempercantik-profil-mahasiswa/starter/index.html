<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktikum 4 - Profil Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Profil Mahasiswa</h1>
        <nav>
            <a href="#biodata">Biodata</a>
            <a href="#pendidikan">Pendidikan</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main>
        <section id="biodata">
            <h2>Biodata</h2>
            <p>Nama: Nama Lengkap Mahasiswa</p>
        </section>

        <section id="pendidikan">
            <h2>Riwayat Pendidikan</h2>
            <table>
                <tr>
                    <th>Jenjang</th>
                    <th>Institusi</th>
                    <th>Tahun</th>
                </tr>
                <tr>
                    <td>SMA</td>
                    <td>SMA Negeri 1</td>
                    <td>2023</td>
                </tr>
            </table>
        </section>

        <section id="kontak">
            <h2>Kontak</h2>
            <a href="mailto:mahasiswa@example.com">Kirim Email</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Profil Mahasiswa</p>
    </footer>
</body>
</html>
